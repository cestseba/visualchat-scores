name: Ajouter un score
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  add-score:
    if: startsWith(github.event.issue.title, 'SCORE:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire et valider
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const repoUrl = context.payload.issue.title.replace('SCORE:', '').trim();
            let body;
            try { body = JSON.parse(context.payload.issue.body || '{}'); }
            catch { core.setFailed('Corps de l\'issue illisible (JSON attendu).'); return; }
            const { pseudo, score, gameName } = body;
            if (!repoUrl || typeof pseudo !== 'string' || !pseudo.trim() || typeof score !== 'number' || !Number.isFinite(score)) {
              core.setFailed('Champs invalides.'); return;
            }
            core.setOutput('repoUrl', repoUrl);
            core.setOutput('pseudo', pseudo.trim().slice(0, 40));
            core.setOutput('score', String(score));
            core.setOutput('gameName', gameName || '');
      - name: Mettre à jour scores.json
        run: |
          node -e '
            const fs = require("fs");
            const repoUrl = process.env.REPO_URL, pseudo = process.env.PSEUDO;
            const score = Number(process.env.SCORE), gameName = process.env.GAME_NAME;
            const scores = fs.existsSync("scores.json") ? JSON.parse(fs.readFileSync("scores.json","utf8")) : {};
            if (!Array.isArray(scores[repoUrl])) scores[repoUrl] = [];
            scores[repoUrl].push({ pseudo, score, gameName, date: new Date().toISOString() });
            scores[repoUrl].sort((a,b) => b.score - a.score);
            scores[repoUrl] = scores[repoUrl].slice(0, 100);
            fs.writeFileSync("scores.json", JSON.stringify(scores, null, 2) + "\n");
          '
        env:
          REPO_URL: ${{ steps.parse.outputs.repoUrl }}
          PSEUDO: ${{ steps.parse.outputs.pseudo }}
          SCORE: ${{ steps.parse.outputs.score }}
          GAME_NAME: ${{ steps.parse.outputs.gameName }}
      - name: Committer
        run: |
          git config user.name "visualchat-scores-bot"
          git config user.email "actions@github.com"
          git add scores.json
          git diff --cached --quiet || git commit -m "Score: ${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          git push
      - name: Fermer l'issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Score enregistré ✅' });
